server.port=8082
spring.application.name=order-service

# Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Inter-Service Communication URL
services.menu-service.url=http://localhost:8081

# Standard Pricing Defaults
foodhub.tax-rate=0.05
foodhub.delivery-fee=30.00

# Logging
logging.level.com.foodhub.order=INFO
